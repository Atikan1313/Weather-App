<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <main class="weather">
        <form action="" class="form">
            <input type="text" class="form__input" placeholder="Enter city name">
            <button class="form__btn">
                <img src="/img/UI/search-2-line.png" alt="Search">
            </button>
        </form>
        <div class="weather__info">
            <img src="./img/weather/clouds_and_sun.png" alt="" class="weather__img">
            <div class="weather__temp">22 ℃</div>
            <div class="weather__city">New York</div>
        </div>
        <div class="weather__details">
            <div class="details">
                <img src="./img/UI/humidity-2-128.png" alt="" class="details__img">
                <div class="details__value">50%</div>
                <div class="details__title">humidity</div>
            </div>
            <div class="details">
                <img src="./img/UI/wind.png" alt="" class="details__img">
                <div class="details__value">10 km/h</div>
                <div class="details__title">Wind</div>
            </div>
        </div>
    </main>
<script src="js/main.js"></script>
</body>
</html>
